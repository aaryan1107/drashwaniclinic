<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F8F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191D1D" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Dr Ashwani Family Clinic: appointments, follow-ups, prescriptions and health logs."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dr Ashwani Family Clinic</title>
    <script src="/clinic-boot.js"></script>
    <style>
      .clinic-boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center;
        gap: 14px; padding: 24px; background: #F4F8F7; color: #172D2A;
        font: 600 1.125rem/1.4 system-ui, sans-serif; text-align: center;
      }
      .clinic-boot.is-ready {
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity 180ms ease-out, visibility 0s linear 180ms;
      }
      /* One clinic mark (a two-tone cross) in every theme; only its colours follow the theme. */
      .clinic-mark {
        --mark-tile: #176763; --mark-line: transparent; --mark-h: #E0F0EC; --mark-v: #9FDCC0;
        position: relative; display: block; flex: none; width: 38px; height: 38px;
        border-radius: 12px; background: var(--mark-tile); border: 1px solid var(--mark-line);
      }
      .clinic-mark::before, .clinic-mark::after {
        content: ""; position: absolute; inset: 50% auto auto 50%; translate: -50% -50%;
        border-radius: 999px;
      }
      .clinic-mark::before { width: 56%; height: 19%; background: var(--mark-h); }
      .clinic-mark::after { width: 19%; height: 56%; background: var(--mark-v); }
      [data-clinic-theme="charcoal"] .clinic-mark,
      :root[data-clinic-boot-theme="charcoal"] .clinic-boot .clinic-mark {
        --mark-tile: #2B4540; --mark-line: #7B968C; --mark-h: #EFF5F2; --mark-v: #B7DED3;
      }
      [data-clinic-theme="pine"] .clinic-mark,
      :root[data-clinic-boot-theme="pine"] .clinic-boot .clinic-mark {
        --mark-tile: #21453C; --mark-line: #5E8C79; --mark-h: #EEF7F0; --mark-v: #ACE1BF;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-clinic-boot-theme]) .clinic-boot .clinic-mark {
          --mark-tile: #2B4540; --mark-line: #7B968C; --mark-h: #EFF5F2; --mark-v: #B7DED3;
        }
      }
      .clinic-boot .clinic-mark { width: 64px; height: 64px; border-radius: 20px; }

      .clinic-boot-progress { width: 56px; height: 4px; border-radius: 100px; background: #176763; animation: clinic-loading 1.1s ease-in-out infinite alternate; }
      @keyframes clinic-loading { from { opacity: 0.38; transform: scaleX(0.36); } to { opacity: 1; transform: scaleX(1); } }
      @media (prefers-color-scheme: dark) {
        .clinic-boot { background: #191D1D; color: #EFF5F2; }
        .clinic-boot-progress { background: #B7DED3; }
      }
      :root[data-clinic-boot-theme="light"] .clinic-boot { background: #F4F8F7; color: #172D2A; }
      :root[data-clinic-boot-theme="light"] .clinic-boot-progress { background: #176763; }
      :root[data-clinic-boot-theme="charcoal"] .clinic-boot { background: #191D1D; color: #EFF5F2; }
      :root[data-clinic-boot-theme="charcoal"] .clinic-boot-progress { background: #B7DED3; }
      :root[data-clinic-boot-theme="pine"] .clinic-boot { background: #14211B; color: #EEF7F0; }
      :root[data-clinic-boot-theme="pine"] .clinic-boot-progress { background: #ACE1BF; }
      @media (prefers-reduced-motion: reduce) {
        .clinic-boot-progress { animation: none; }
        .clinic-boot.is-ready { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="clinic-boot" id="clinic-boot">
      <span class="clinic-mark" aria-hidden="true"></span>
      <span>Dr Ashwani Family Clinic</span>
      <span class="clinic-boot-progress" role="status" aria-label="Opening the clinic app"></span>
      <noscript>Turn on JavaScript to open the clinic app.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
